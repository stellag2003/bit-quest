/* ───────────── Tokens ───────────── */
:root {
  /* Console shell (fixed) */
  --shell-hi: #7b68da;
  --shell: #5b47b8;
  --shell-lo: #44349b;
  --shell-ink: #271d66;
  --bezel: #2a2446;
  --bezel-ink: #9a90d6;
  --btn-ab: #f25f5c;
  --btn-ab-hi: #ff9b8f;
  --btn-ab-lo: #a8302f;
  --dpad: #221d3a;
  --sky-top: #8fd3ff;
  --sky-bottom: #dff5ff;

  /* Screen palette — overwritten at runtime by ThemeService */
  --c0: #0f380f;
  --c1: #306230;
  --c2: #8bac0f;
  --c3: #c9dc8b;

  /* Pixel borders: four hard shadows leave the corners notched. */
  --edge: 0 -3px 0 0 var(--c0), 0 3px 0 0 var(--c0), -3px 0 0 0 var(--c0), 3px 0 0 0 var(--c0);
  --edge-light: 0 -3px 0 0 var(--c3), 0 3px 0 0 var(--c3), -3px 0 0 0 var(--c3), 3px 0 0 0 var(--c3);
  --dither: repeating-conic-gradient(var(--c2) 0 25%, transparent 0 50%) 0 0 / 4px 4px;

  --font-pixel: 'Pixelify Sans', ui-monospace, 'Cascadia Mono', 'Consolas', monospace;
  --font-brand: 'Silkscreen', 'Pixelify Sans', ui-monospace, monospace;
}

/* ───────────── Reset ───────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: linear-gradient(var(--sky-top), var(--sky-bottom));
  font-family: var(--font-pixel);
  -webkit-font-smoothing: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  color: inherit;
}

canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.noscript {
  position: fixed;
  inset: auto 16px 16px;
  padding: 12px;
  background: #fff;
  font-family: system-ui, sans-serif;
}

/* ───────────── Sky backdrop (desktop) ───────────── */
.sky {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.cloud {
  position: absolute;
  width: 120px;
  height: 36px;
  background: #fff;
  opacity: 0.85;
  clip-path: polygon(0 100%, 0 66%, 12% 66%, 12% 33%, 30% 33%, 30% 0, 62% 0, 62% 33%, 82% 33%, 82% 66%, 100% 66%, 100% 100%);
  animation: drift 90s linear infinite;
}

.cloud--a { top: 12%; left: -10%; }
.cloud--b { top: 34%; left: 60%; transform: scale(0.7); animation-duration: 120s; animation-delay: -40s; }
.cloud--c { top: 72%; left: 20%; transform: scale(1.3); animation-duration: 150s; animation-delay: -90s; opacity: 0.6; }

@keyframes drift {
  from { translate: -20vw 0; }
  to { translate: 120vw 0; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

body.is-calm *,

body.is-calm *::after {

  animation-iteration-count: 1 !important;
  transition-duration: 0.001ms !important;
}

/* Accessibility settings */
body.is-plain-font {
  --font-pixel: 'Atkinson Hyperlegible', Verdana, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: auto;
}

.lcd {

/* Pixel grid + inner shadow on top of everything rendered in the LCD */
.lcd::after {

/* ───────────── Controls ───────────── */
.console__controls {

.dpad__btn,
.dpad__center {

  background: var(--dpad);
}

.dpad__up { grid-area: 1 / 2; border-radius: 6px 6px 0 0; }
.dpad__left { grid-area: 2 / 1; border-radius: 6px 0 0 6px; }

  <style>
/* ───────────── Screen base ───────────── */
.scr {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 10px;
  overflow: hidden;
  color: var(--c0);
  background: var(--c3);
  font-size: 17px;
  line-height: 1.3;
  animation: scr-in 0.2s steps(3) both;
}

.scr h1,
.scr h2,
.scr p {
  text-wrap: pretty;
}

@media (max-width: 360px) {
  .scr { font-size: 15.5px; }
}

/* ───────────── Icons ───────────── */
.ico {
  display: inline-block;
  flex: none;
  width: 1.1em;
  height: 1.1em;
  vertical-align: -0.16em;
  background: currentColor;

.pbtn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45em;
  min-height: 44px;
  padding: 0.4em 1em;
  border: 0;
  background: var(--c3);
  color: var(--c0);
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--edge), inset -3px -3px 0 var(--c2);

.pbtn--primary {
  background: var(--c1);

.loop__add {
  width: 36px;
  height: 36px;
  border: 2px dashed var(--c0);
  background: transparent;
  font-size: 1.3em;
  font-weight: 700;
  cursor: pointer;
}

/* Rules (Fase 2) */
.rules {
  flex-direction: column;
  align-items: stretch;
  flex-wrap: nowrap;
  gap: 6px;
}

.rule {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: 3px;
  padding: 2px 6px;
  background: var(--c3);
  box-shadow: var(--edge);
}

.rule.is-active {
  background: var(--c0);
  color: var(--c3);
}

.rule-default {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 0 4px;
}

.rule-default.is-active,
.rule-default.is-error {
  background: var(--c0);
  color: var(--c3);
}

.slot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 92px;
  min-height: 36px;
  margin: 3px;
  padding: 0 4px;
  border: 0;
  background: transparent;
  cursor: pointer;
  outline: 2px dashed var(--c1);
  outline-offset: -2px;
}

.slot.is-filled {
  outline: none;
  background: var(--c3);
  box-shadow: var(--edge), inset 0 -3px 0 var(--c2);
}

.slot--condition.is-filled {
  background: var(--c2);
  box-shadow: var(--edge), inset 0 -3px 0 var(--c1);
}

.slot.is-selected {
  outline: 3px solid var(--c0);
  outline-offset: 2px;
  animation: cursor-blink 0.9s steps(1) infinite;
}

.slot__empty {
  font-size: 1.3em;
  font-weight: 700;
  color: var(--c1);
}

.rule.is-active .slot,
.rule.is-error .slot {
  color: var(--c0);
}

/* Palette + actions */
.challenge__controls {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.palette {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px;
}

.palette--grid {
  display: grid;
  grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
  gap: 6px;
  padding: 0 3px;
}

.palette--rules {
  display: grid;
  grid-template-columns: var(--split, 2fr 3fr);
  gap: 10px;
  padding: 0 3px;
}

.palette__group {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.palette__items {
  display: grid;
  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  gap: 6px;
}

.palette--grid .chip,
.palette__items .chip {
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  min-height: 54px;
  margin: 3px 0;
  padding: 4px 2px;
}

.palette--grid .chip__label,
.palette__items .chip__label {
  align-items: center;
  font-size: 0.88em;
  text-align: center;
}

.challenge__actions {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 3px 3px;
}

.pbtn--run {
  flex: 1;
}

.scr--challenge.is-running .challenge__controls {
  opacity: 0.55;
}

/* Feedback card: takes the place of the palette so the program stays visible */
.challenge__controls.has-feedback > :not(.feedback-layer) {
  display: none;
}

.feedback {
  margin: 3px;
  padding: 8px 10px;
  animation: slide-up 0.2s steps(3);
}

.feedback__head {
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.15;
}

.feedback__icon {
  width: 24px;
  height: 24px;
}

.feedback__hint,
.feedback__note {
  margin: 4px 0 0;
  font-size: 0.85em;
  line-height: 1.25;
}

.feedback__note {
  color: var(--c1);
}

.feedback__actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 8px;
}

.feedback__actions .pbtn {
  min-height: 40px;
}

.banner {
  position: absolute;
  left: 50%;
  bottom: 40%;
  padding: 10px 22px;
  translate: -50% 0;
  background: var(--c0);
  color: var(--c3);
  font-family: var(--font-brand);
  font-size: 1.5em;
  box-shadow: var(--edge-light);
  animation: pop 0.3s steps(4);
  white-space: nowrap;
}

/* ───────────── Result ───────────── */
.scr--result {
  overflow-y: auto;
}

.result {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-block: auto;
  padding: 6px 2px 10px;
  text-align: center;
}

.result__kicker {
  margin: 0;
  font-size: 0.85em;
  color: var(--c1);
}

.result__title {
  margin: 0;
  font-family: var(--font-brand);
  font-size: 1.6em;
  text-transform: uppercase;
}

.result--fase .result__title {
  animation: flash 0.5s steps(1) 4;
}

.result__praise,
.result__note {
  margin: 0;
}

.result__note {
  font-size: 0.85em;
}

.rewards {
  display: flex;
  gap: 14px;
}

.reward {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 3px;
  padding: 6px 14px;
  background: var(--c1);
  color: var(--c3);
  font-size: 1.25em;
  font-weight: 700;
  box-shadow: var(--edge);
}

.reward__label {
  font-size: 0.8em;
}

.result__message {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 3px;
  padding: 10px;
  text-align: left;
}

.result__message p {
  margin: 0;
  font-size: 0.9em;
  line-height: 1.35;
}

.savings {
  width: calc(100% - 6px);
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 3px;
  padding: 10px;
  font-size: 0.85em;
}

.savings__row {
  display: grid;
  grid-template-columns: 5.5em 1fr 2em;
  align-items: center;
  gap: 8px;
  text-align: left;
}

.savings__bar {
  height: 12px;
  background: var(--c2);
}

.savings__bar i {
  display: block;
  width: var(--w);
  height: 100%;
  background: var(--c0);
  animation: grow 0.8s steps(8);
}

.savings p {
  margin: 2px 0 0;
  font-weight: 600;
}

.medals-earned {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 0.85em;
}

.result__actions {
  display: flex;
  gap: 12px;
  width: 100%;
  padding: 4px 3px 3px;
}

.result__actions .pbtn {
  flex: 1;
}

/* ───────────── Mentor unlock ───────────── */
.scr--mentor {
  align-items: center;
  overflow-y: auto;
  background: var(--c0);
  color: var(--c3);
  text-align: center;
}

.unlock__kicker {
  margin: 6px 0 0;
  font-family: var(--font-brand);
  font-size: 1.05em;
  animation: flash 0.5s steps(1) infinite;
}

.is-revealed .unlock__kicker {
  animation: none;
}

.unlock__frame {
  padding: 10px;
  background: var(--c1);
  box-shadow: var(--edge-light);
  margin: 3px;
}

.unlock__portrait {
  display: block;
  width: 96px;
  height: 96px;
  background: var(--c3);
  box-shadow: none;
}

.is-revealed .unlock__frame {
  animation: pop 0.3s steps(3);
}

.unlock__details {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  text-align: left;
}

.unlock__details:empty {
  display: none;
}

.unlock__actions {
  display: flex;
  gap: 12px;
  padding: 0 3px 6px;
}

.unlock__actions .pbtn {
  flex: 1;
}

/* Mentor story (shared) */
.mentor-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.mentor-card__name {
  margin: 0;
  font-size: 1.35em;
}

.mentor-card__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 12px;
  margin: 0;
  font-size: 0.8em;
  opacity: 0.85;
}

.mentor-card > p {
  margin: 0;
  font-size: 0.92em;
  line-height: 1.35;
}

.mentor-card__fact {
  margin: 3px;
  padding: 8px 10px;
  color: var(--c0);
}

.mentor-card__fact strong {
  display: flex;
  align-items: center;
  gap: 4px;
}

.mentor-card__fact p {
  margin: 4px 0 0;
  font-size: 0.9em;
  line-height: 1.35;
}

.mentor-card__message {
  margin: 0;
  padding: 4px 0 4px 10px;
  border-left: 4px solid currentColor;
}

.mentor-card__message p {
  margin: 0;
  font-weight: 600;
  line-height: 1.3;
}

.mentor-card__message footer {
  margin-top: 4px;
  font-size: 0.8em;
  opacity: 0.8;
}

/* ───────────── Library ───────────── */
.tabs {
  display: flex;
  gap: 8px;
  padding: 3px;
}

.tab {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.35em;
  min-height: 40px;
  border: 0;
  background: var(--c3);
  font-size: 0.88em;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--edge);
}

.tab[aria-selected='true'] {
  background: var(--c1);
  color: var(--c3);
}

.library__body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 6px 3px 12px;
}

.mentor-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.mentor-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  margin: 3px;
  padding: 10px 6px;
  border: 0;
  background: var(--c3);
  text-align: center;
  cursor: pointer;
  box-shadow: var(--edge);
}

.mentor-tile small {
  font-size: 0.8em;
  color: var(--c1);
}

.mentor-tile.is-current {
  background: var(--c2);
}

.mentor-tile.is-current small,
.mentor-tile.is-locked small {
  color: var(--c0);
}

.mentor-tile.is-locked {
  background: var(--dither), var(--c3);
}

.mentor-detail {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.mentor-detail .mentor-card {
  width: 100%;
}

.concepts,
.medals {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.concept {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  margin: 3px;
  padding: 10px;
}

.concept h2 {
  margin: 0;
  font-size: 1.1em;
}

.concept p {
  margin: 0;
  font-size: 0.9em;
  line-height: 1.35;
}

.concept.is-locked {
  background: var(--dither), var(--c3);
}

.medal {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--c1);
}

.medal.is-earned {
  color: var(--c0);
}

.medal__badge {
  display: grid;
  place-items: center;
  flex: none;
  width: 42px;
  height: 42px;
  margin: 3px;
  background: var(--c2);
  box-shadow: var(--edge);
}

.medal.is-earned .medal__badge {
  background: var(--c1);
  color: var(--c3);
}

.medal__badge .ico {
  width: 22px;
  height: 22px;
}

.medal small {
  display: block;
  font-size: 0.8em;
}

/* ───────────── Settings ───────────── */
.settings {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 4px 3px 12px;
  overflow-y: auto;
}

.settings section {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.settings h2 {
  margin: 0;
  font-size: 0.95em;
  color: var(--c1);
}

.toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  margin: 0 3px;
  padding: 0 12px;
  border: 0;
  background: var(--c3);
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--edge);
}

.toggle span {
  flex: 1;
  text-align: left;
}

.toggle__state {
  padding: 2px 8px;
  background: var(--c2);
  font-size: 0.85em;
}

.toggle.is-on .toggle__state {
  background: var(--c0);
  color: var(--c3);
}

.swatches {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.swatch {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  margin: 3px;
  padding: 8px;
  border: 0;
  background: var(--c3);
  cursor: pointer;
  box-shadow: var(--edge);
}

.swatch__colors {
  display: flex;
  width: 100%;
  height: 18px;
  box-shadow: 0 0 0 2px var(--c0);
}

.swatch__colors i {
  flex: 1;
}

.swatch small {
  font-size: 0.8em;
}

.swatch.is-current {
  background: var(--c2);
}

.controls-list {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 12px;
  margin: 0;
  font-size: 0.82em;
}

.controls-list dt {
  font-weight: 700;
}

.controls-list dd {
  margin: 0;
}

/* Wide LCD (phone sideways, short desktop windows): map left, code right. */
@container lcd (min-aspect-ratio: 21 / 20) {
  .scr--challenge {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas:
      'top top'
      'goal program'
      'stage program'
      'stage controls';
    column-gap: 12px;
  }

  .scr--challenge > .topbar { grid-area: top; }
  .scr--challenge > .goal { grid-area: goal; }
  .scr--challenge > .challenge__stage { grid-area: stage; min-height: 0; }
  .scr--challenge > .program { grid-area: program; min-height: 0; }
  .scr--challenge > .challenge__controls { grid-area: controls; }
  .scr--challenge .program__list,
  .scr--challenge .rules { max-height: none; flex: 1; }

  .scr--challenge > .program { min-height: 84px; }
  .scr--challenge .feedback__note { display: none; }
  .scr--challenge .feedback__head { font-size: 0.9em; }
  .scr--challenge .feedback__actions .pbtn { flex: 1; min-height: 36px; padding-inline: 0.5em; white-space: nowrap; }

  .scr--lesson .lesson__demo { flex-direction: row; }

  .scr--home {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
    grid-template-rows: auto 1fr auto auto auto;
    grid-template-areas:
      'top top'
      'hero speech'
      'hero xp'
      'hero actions'
      'progress progress';
    column-gap: 16px;
  }

  .scr--home > .home__top { grid-area: top; }
  .scr--home > .home__hero { grid-area: hero; flex-direction: column; gap: 6px; }
  .scr--home > .speech { grid-area: speech; align-self: end; }
  .scr--home > .xpbar { grid-area: xp; }
  .scr--home > .home__actions { grid-area: actions; gap: 8px; }
  .scr--home > .home__progress { grid-area: progress; }
  .scr--home .logo { font-size: 30px; }
  .scr--home .home__robot { width: 48px; height: 48px; }
  .scr--home .pbtn { min-height: 40px; }
  .scr--home .pbtn--big { font-size: 1.1em; min-height: 44px; }
}

/* ───────────── Small LCDs: keep the larger type but tighten the layout ───────────── */
.home__row > .pbtn { min-width: 0; padding-inline: 0.5em; }

@container lcd (max-width: 380px) {
  .home__chips { gap: 6px; }
  .home__chips .stat small { display: none; }
  .energy--btn { padding-inline: 5px; }
  .energy--btn .energy__cell { width: 5px; }
  .slot { min-width: 64px; }
  .rule { gap: 4px; padding-inline: 4px; }
}

@container lcd (max-height: 480px) {
  .scr { font-size: 15.5px; gap: 6px; }
  .rule { flex-wrap: nowrap; }
  .slot { min-width: 64px; }
}

/* Short portrait LCDs: the run button must stay on screen */
@container lcd (max-height: 480px) and (max-aspect-ratio: 21 / 20) {
  .scr--challenge { gap: 5px; }
  .scr--challenge .goal { font-size: 0.85em; }
  .scr--challenge .rules { max-height: 112px; }
  .palette--grid .chip,
  .palette__items .chip { min-height: 46px; }
}

/* Small phones held sideways */
@container lcd (min-aspect-ratio: 21 / 20) and (max-width: 460px) {
  .scr--challenge { font-size: 14px; column-gap: 8px; }
  .scr--challenge .palette--rules { gap: 4px; }
  .scr--challenge .palette__items .chip__label { font-size: 0.8em; }
}

/* ───────────── Main character next to Bit ───────────── */
.home__duo,
.guide__duo {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

.home__hero-art {
  width: 64px;
  height: 64px;
}

.pixelart {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

.home__mary {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin: 0;
}

.home__mary figcaption {
  font-size: 0.8em;
  font-weight: 600;
}

/* ───────────── Challenge layout: the run button never leaves the screen ───────────── */
/* The map takes the free space; the program shrinks first and scrolls inside itself. */
.scr--challenge > .challenge__stage { flex: 1 1 0; min-height: 112px; }
/* Last resort on very short screens: the whole challenge scrolls, so Executar is always reachable. */
.scr--challenge { overflow-y: auto; touch-action: pan-y; scrollbar-width: thin; }
.scr--challenge > .program { flex: 0 1 auto; min-height: 84px; }
.scr--challenge > .program > .program__list,
.scr--challenge > .program > .rules { position: relative; flex: 0 1 auto; min-height: 46px; touch-action: pan-y; }
.scr--challenge > .challenge__controls { flex: none; }

/* Two maps side by side */
.challenge__maps {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.challenge__map {
  min-width: 0;
  min-height: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.challenge__map figcaption {
  text-align: center;
  font-size: 0.8em;
  font-weight: 600;
}

.challenge__map .world.is-playing .world__canvas {
  outline: 3px solid var(--c0);
  outline-offset: 3px;
}

/* ───────────── Difficulty ───────────── */
.scr--difficulty {
  gap: 10px;
}

.difficulty__head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.difficulty__title {
  margin: 0;
  font-size: 1.3em;
}

.difficulty__subtitle {
  margin: 2px 0 0;
  font-size: 0.85em;
  color: var(--c1);
}

.difficulty__list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: grid;
  align-content: start;
  gap: 10px;
  padding: 3px;
}

.difficulty-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  text-align: left;
  cursor: pointer;
}

.difficulty-card.is-current {
  background: var(--c2);
}

.difficulty-card__icon .ico {
  width: 28px;
  height: 28px;
}

.difficulty-card__body strong {
  display: block;
  font-size: 1.2em;
  margin-bottom: 4px;
}

.difficulty-card__body ul {
  margin: 0;
  padding-left: 1.1em;
  font-size: 0.9em;
}

.home__level {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 2px 6px;
  border: 0;
  background: transparent;
  box-shadow: var(--edge);
  font-weight: 600;
  cursor: pointer;
}

.fase__num {
  font-family: var(--font-brand);
  font-size: 1.5em;
}

/* ───────────── Fase 4: buggy program tag · Fase 5: ★ function ───────────── */
.program__bug {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 0 5px;
  background: var(--c0);
  color: var(--c3);
  font-weight: 700;
}

/* The ★ frame spans the whole first line so it reads as "the block definition" */
.loop--fn {
  flex-basis: calc(100% - 6px);
  background: var(--c0);
  color: var(--c3);
}

.loop--fn .loop__body {
  min-height: 40px;
}

.loop__fnname {
  display: inline-flex;
  align-items: center;
  gap: 0.3em;
  font-weight: 700;
  padding: 0 0.35em;
}

.loop__fncount {
  margin-left: auto;
  font-size: 0.8em;
}

.chip--call {
  font-weight: 700;
}


.strip__fn {
  background: var(--c0);
  color: var(--c3);
}

/* ───────────── Finale & certificate ───────────── */
.scr--finale {
  overflow-y: auto;
  touch-action: pan-y;
}

.finale__confetti {
  position: absolute;
  inset: 0;
  z-index: 5;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.finale {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: 6px;
}

.finale__hero {
  display: flex;
  flex-direction: column;

/**
 * Minimal publish/subscribe channel. Lets rules announce what happened
 * (xp earned, mentor unlocked...) without knowing who reacts (audio, UI).
 */
class EventBus {
  constructor() {
    this.handlers = new Map();
  }

  on(type, handler) {
    if (!this.handlers.has(type)) this.handlers.set(type, new Set());
    this.handlers.get(type).add(handler);
    return () => this.handlers.get(type)?.delete(handler);
  }

  emit(type, payload) {
    for (const handler of this.handlers.get(type) ?? []) {
      try {
        handler(payload);
      } catch (error) {
        console.error(`[EventBus] handler for "${type}" failed`, error);
      }
    }
  }
}

return { EventBus };

/** Persists progress in LocalStorage; tolerant to corrupted saves and blocked storage. */
class LocalStorageRepository {
  constructor(key = 'bitquest.save.v1', storage = globalThis.localStorage) {
    this.key = key;
    this.storage = storage;
  }

  static isAvailable(storage = globalThis.localStorage) {
    try {
      const probe = '__bitquest_probe__';
      storage.setItem(probe, '1');
      storage.removeItem(probe);
      return true;
    } catch {
      return false;
    }
  }

  load() {
    try {
      const raw = this.storage.getItem(this.key);
      return raw ? JSON.parse(raw) : null;
    } catch (error) {
      console.warn('[save] ignorando save inválido', error);
      return null;
    }
  }

  save(progress) {
    try {
      this.storage.setItem(this.key, JSON.stringify(progress));
    } catch (error) {
      console.warn('[save] não foi possível salvar', error);
    }
  }
}

return { LocalStorageRepository };
})();

function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (value == null || value === false) continue;

    else if (key === 'dataset') Object.assign(el.dataset, value);
    else if (key === 'style' && typeof value === 'object') Object.entries(value).forEach(([k, v]) => el.style.setProperty(k, v));
    else if (key.startsWith('on') && typeof value === 'function') el.addEventListener(key.slice(2).toLowerCase(), value);

    else el.setAttribute(key, value);

/** Draws a sprite (rows of palette indices) onto a 2D context at art-pixel scale 1. */
function drawSprite(ctx, rows, ox, oy, colors, { flip = false, tone = null } = {}) {
  const width = rows[0].length;
  rows.forEach((row, y) => {
    for (let x = 0; x < width; x += 1) {
      const ch = row[x];
      if (ch === '.') continue;
      ctx.fillStyle = tone ?? colors[Number(ch)];
      ctx.fillRect(ox + (flip ? width - 1 - x : x), oy + y, 1, 1);
    }
  });
}

/** Opaque pixels as [x, y, colorIndex] — used by the mentor reveal animation. */
function spritePixels(rows) {
  const pixels = [];
  rows.forEach((row, y) => [...row].forEach((ch, x) => ch !== '.' && pixels.push([x, y, Number(ch)])));
  return pixels;
}

function spriteCanvas(rows, colors, scale = 4, options = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = rows[0].length * scale;
  canvas.height = rows.length * scale;
  canvas.className = 'sprite';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  drawSprite(ctx, rows, 0, 0, colors, options);
  return canvas;
}

return { drawSprite, spritePixels, spriteCanvas };
