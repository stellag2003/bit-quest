  <style>
/* ───────────── Tokens ───────────── */
:root {
  /* Console shell (fixed) */
  --shell-hi: #7b68da;
  --shell: #5b47b8;
  --shell-lo: #44349b;
  --shell-ink: #271d66;
  --bezel: #2a2446;
  --bezel-ink: #9a90d6;
  --btn-ab: #f25f5c;
  --btn-ab-hi: #ff9b8f;
  --btn-ab-lo: #a8302f;
  --dpad: #221d3a;
  --pill: #3a2f7a;
  --sky-top: #8fd3ff;
  --sky-bottom: #dff5ff;

  /* Screen palette — overwritten at runtime by ThemeService */
  --c0: #0f380f;
  --c1: #306230;
  --c2: #8bac0f;
  --c3: #c9dc8b;

  /* Pixel borders: four hard shadows leave the corners notched. */
  --edge: 0 -3px 0 0 var(--c0), 0 3px 0 0 var(--c0), -3px 0 0 0 var(--c0), 3px 0 0 0 var(--c0);
  --edge-light: 0 -3px 0 0 var(--c3), 0 3px 0 0 var(--c3), -3px 0 0 0 var(--c3), 3px 0 0 0 var(--c3);
  --dither: repeating-conic-gradient(var(--c2) 0 25%, transparent 0 50%) 0 0 / 4px 4px;

  --font-pixel: 'Pixelify Sans', ui-monospace, 'Cascadia Mono', 'Consolas', monospace;
  --font-brand: 'Silkscreen', 'Pixelify Sans', ui-monospace, monospace;
}

/* ───────────── Reset ───────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: linear-gradient(var(--sky-top), var(--sky-bottom));
  font-family: var(--font-pixel);
  -webkit-font-smoothing: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}

button {
  font: inherit;
  color: inherit;
}

canvas {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.noscript {
  position: fixed;
  inset: auto 16px 16px;
  padding: 12px;
  background: #fff;
  font-family: system-ui, sans-serif;
}

/* ───────────── Sky backdrop (desktop) ───────────── */
.sky {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.cloud {
  position: absolute;
  width: 120px;
  height: 36px;
  background: #fff;
  opacity: 0.85;
  clip-path: polygon(0 100%, 0 66%, 12% 66%, 12% 33%, 30% 33%, 30% 0, 62% 0, 62% 33%, 82% 33%, 82% 66%, 100% 66%, 100% 100%);
  animation: drift 90s linear infinite;
}

.cloud--a { top: 12%; left: -10%; }
.cloud--b { top: 34%; left: 60%; transform: scale(0.7); animation-duration: 120s; animation-delay: -40s; }
.cloud--c { top: 72%; left: 20%; transform: scale(1.3); animation-duration: 150s; animation-delay: -90s; opacity: 0.6; }

@keyframes drift {
  from { translate: -20vw 0; }
  to { translate: 120vw 0; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

  <style>
/* ───────────── Handheld shell ───────────── */
.console {
  position: relative;
  z-index: 1;
  width: min(100vw, 440px);
  height: min(100dvh, 900px);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  grid-template-areas: 'ridge' 'bezel' 'brand' 'controls';
  padding: max(8px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom));
  background:
    radial-gradient(120% 60% at 20% 0%, rgba(255, 255, 255, 0.16), transparent 60%),
    linear-gradient(165deg, var(--shell-hi), var(--shell) 28%, var(--shell) 72%, var(--shell-lo));
  border-radius: 16px 16px 76px 16px;
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.28),
    inset -6px -8px 0 rgba(0, 0, 0, 0.16),
    0 40px 70px -30px rgba(36, 18, 96, 0.6);
}

.console__ridge {
  grid-area: ridge;
  display: flex;
  justify-content: space-between;
  padding: 0 8px 6px;
  border-bottom: 2px solid rgba(0, 0, 0, 0.14);
  box-shadow: 0 2px 0 rgba(255, 255, 255, 0.12);
  margin: 0 -16px 10px;
  padding-inline: 24px;
  font-family: var(--font-brand);
  font-size: 9px;
  color: var(--shell-ink);
  opacity: 0.7;
}

/* Screen bezel */
.bezel {
  grid-area: bezel;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 8px 14px 6px;
  background: var(--bezel);
  border-radius: 10px 10px 42px 10px;
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.3), 0 1px 0 rgba(255, 255, 255, 0.22);
}

.bezel__top {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 14px;
  margin-bottom: 7px;
  font-family: var(--font-brand);
  font-size: 8px;
  color: var(--bezel-ink);
  white-space: nowrap;
}

.bezel__stripes {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.bezel__stripes i {
  height: 2px;
  background: #d14a7a;
}

.bezel__stripes i + i {
  background: #5a6fd6;
}

.led {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4b2235;
  box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.4);
  transition: background 0.3s, box-shadow 0.3s;
}

body.is-powered .led {
  background: #ff5262;
  box-shadow: 0 0 8px 2px rgba(255, 82, 98, 0.65);
}

body.is-powered.is-muted .led {
  background: #c46c7a;
  box-shadow: none;
}

.lcd {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  border-radius: 3px;
  background: var(--c3);
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.35);
}

/* Pixel grid + inner shadow on top of everything rendered in the LCD */
.lcd::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
  background-size: 3px 3px;
  box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.22);
}

body:not(.is-powered) .lcd::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 49;
  pointer-events: none;
  background: rgba(30, 40, 20, 0.22);
}

.lcd__screen {
  position: absolute;
  inset: 0;
  container: lcd / size;
}

.lcd__overlay {
  position: absolute;
  inset: 6px 8px auto;
  z-index: 45;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 3px 10px;
  min-height: 24px;
  padding-top: 6px;
  font-family: var(--font-brand);
  font-size: 9px;
  color: var(--bezel-ink);
}

.legend__item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.legend__key {
  display: inline-grid;
  place-items: center;
  min-width: 15px;
  height: 15px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--btn-ab);
  color: #fff;
  font-size: 8px;
}

.legend__key--start,
.legend__key--select {
  border-radius: 4px;
  background: #4a3d9a;
}

/* Printed brand */
.brand {
  grid-area: brand;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 6px 0;
}

.brand__name {
  font-family: var(--font-brand);
  font-weight: 700;
  font-size: 22px;
  color: var(--shell-ink);
  transform: skewX(-8deg);
}

.brand__name em {
  font-style: normal;
  color: var(--btn-ab);
  text-shadow: 2px 2px 0 var(--shell-ink);
}

.brand__tag {
  font-family: var(--font-brand);
  font-size: 9px;
  color: rgba(255, 255, 255, 0.6);
}

/* ───────────── Controls ───────────── */
.console__controls {
  grid-area: controls;
  position: relative;
  height: 196px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr auto;
  padding: 4px 4px 0;
}

.console__controls button {
  border: 0;
  padding: 0;
  cursor: pointer;
  touch-action: none;
}

.dpad {
  grid-column: 1;
  grid-row: 1;
  align-self: center;
  justify-self: start;
  width: 126px;
  height: 126px;
  margin-left: 4px;
  display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.3));
}

.dpad__btn,
.dpad__center {
  position: relative;
  background: var(--dpad);
}

.dpad__up { grid-area: 1 / 2; border-radius: 6px 6px 0 0; }
.dpad__left { grid-area: 2 / 1; border-radius: 6px 0 0 6px; }
.dpad__center { grid-area: 2 / 2; background: radial-gradient(circle, #191530 34%, var(--dpad) 36%); }
.dpad__right { grid-area: 2 / 3; border-radius: 0 6px 6px 0; }
.dpad__down { grid-area: 3 / 2; border-radius: 0 0 6px 6px; }

.dpad__btn::after {
  content: '';
  position: absolute;
  inset: 0;
  margin: auto;
  width: 10px;
  height: 8px;
  background: #3d3566;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.dpad__down::after { rotate: 180deg; }
.dpad__left::after { rotate: -90deg; }
.dpad__right::after { rotate: 90deg; }

.dpad__btn.is-down { background: #120f24; }
.dpad__up.is-down { translate: 0 2px; }
.dpad__down.is-down { translate: 0 -2px; }
.dpad__left.is-down { translate: 2px 0; }
.dpad__right.is-down { translate: -2px 0; }

.ab {
  grid-column: 2;
  grid-row: 1;
  align-self: center;
  justify-self: end;
  display: flex;
  gap: 16px;
  padding: 9px 10px 6px;
  border-radius: 48px;
  background: rgba(0, 0, 0, 0.09);
  transform: rotate(-24deg);
}

.ab__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.ab__item span,
.pill span {
  font-family: var(--font-brand);
  font-weight: 700;
  color: var(--shell-ink);
}

.ab__item span {
  font-size: 13px;
}

.round-btn {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, var(--btn-ab-hi), var(--btn-ab) 42%, var(--btn-ab-lo));
  box-shadow: 0 4px 0 #86262a, 0 7px 10px rgba(0, 0, 0, 0.28);
  transition: transform 0.05s, box-shadow 0.05s;
}

.round-btn.is-down {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #86262a, 0 2px 4px rgba(0, 0, 0, 0.3);
}

.pills {
  grid-column: 1 / -1;
  grid-row: 2;
  display: flex;
  justify-content: center;
  gap: 18px;
  padding: 0 0 6px;
}

.pill {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transform: rotate(-24deg);
}

.pill__btn {
  position: relative;
  width: 50px;
  height: 13px;
  border-radius: 8px;
  background: var(--pill);
  box-shadow: 0 2px 0 #221a52, inset 0 1px 0 rgba(255, 255, 255, 0.2);
}

.pill__btn::before {
  content: '';
  position: absolute;
  inset: -14px -8px;
}

.pill__btn.is-down {
  translate: 0 2px;
  box-shadow: none;
}

.pill span {
  font-size: 8px;
  letter-spacing: 0.06em;
}

.speaker {
  position: absolute;
  right: 22px;
  bottom: 4px;
  display: flex;
  gap: 6px;
  transform: rotate(-28deg);
}

.speaker i {
  width: 5px;
  height: 40px;
  border-radius: 3px;
  background: rgba(0, 0, 0, 0.24);
  box-shadow: inset 0 2px 2px rgba(0, 0, 0, 0.35);
}

/* ───────────── Responsive shell ───────────── */
@media (max-width: 480px) {
  .console {
    width: 100vw;
    height: 100dvh;
    border-radius: 0 0 56px 0;
    padding-inline: 12px;
  }

  .console__ridge {
    margin-inline: -12px;
  }
}

@media (max-height: 780px) {
  .console__controls { height: 164px; }
  .dpad { width: 112px; height: 112px; }
  .round-btn { width: 52px; height: 52px; }
  .brand { padding-top: 6px; }
  .brand__name { font-size: 18px; }
  .speaker i { height: 30px; }
}

@media (max-height: 680px) {
  .console__ridge,
  .brand__tag { display: none; }
  .bezel__top { display: none; }
  .console__controls { height: 148px; }
  .dpad { width: 104px; height: 104px; }
  .round-btn { width: 48px; height: 48px; }
}

/* Phone held sideways: GBA-style layout */
@media (orientation: landscape) and (max-height: 540px) {
  .console {
    width: 100vw;
    height: 100dvh;
    max-width: none;
    border-radius: 0;
    grid-template-columns: minmax(130px, 1fr) minmax(0, 2.4fr) minmax(130px, 1fr);
    grid-template-rows: minmax(0, 1fr);
    grid-template-areas: 'dpad bezel ab';
    column-gap: 12px;
    padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }

  .console__ridge,
  .brand,
  .speaker,
  .bezel__top { display: none; }

  .bezel { border-radius: 10px; }
  .console__controls { display: contents; }
  .dpad { grid-area: dpad; justify-self: center; align-self: center; margin: 0; }
  .ab { grid-area: ab; justify-self: center; align-self: center; }
  .pills { grid-area: ab; align-self: end; padding-bottom: 12px; }
}

</style>
  <style>
/* ───────────── Screen base ───────────── */
.scr {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 10px;
  overflow: hidden;
  color: var(--c0);
  background: var(--c3);
  font-size: 15px;
  line-height: 1.25;
  animation: scr-in 0.2s steps(3) both;
}

.scr h1,
.scr h2,
.scr p {
  text-wrap: pretty;
}

@media (max-width: 360px) {
  .scr { font-size: 13.5px; }
}

/* ───────────── Icons ───────────── */
.ico {
  display: inline-block;
  flex: none;
  width: 1.1em;
  height: 1.1em;
  vertical-align: -0.16em;
  background: currentColor;
  -webkit-mask: var(--icon) center / contain no-repeat;
  mask: var(--icon) center / contain no-repeat;
}

/* ───────────── Focus (keyboard + D-pad cursor) ───────────── */
.lcd :focus {
  outline: none;
}

.lcd :focus-visible,
body.using-dpad .lcd .is-cursor {
  outline: 3px dashed var(--c0);
  outline-offset: 5px;
  animation: cursor-blink 0.9s steps(1) infinite;
}

/* ───────────── Buttons ───────────── */
.pbtn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45em;
  min-height: 44px;
  padding: 0.4em 1em;
  border: 0;
  background: var(--c3);
  color: var(--c0);
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--edge), inset -3px -3px 0 var(--c2);
}

.pbtn--primary {
  background: var(--c1);
  color: var(--c3);
  box-shadow: var(--edge), inset -3px -3px 0 var(--c0), inset 3px 3px 0 var(--c2);
}

.pbtn--big {
  min-height: 54px;
  font-size: 1.3em;
}

.pbtn:active:not(:disabled) {
  translate: 0 2px;
  box-shadow: var(--edge), inset 3px 3px 0 var(--c2);
}

.pbtn:disabled {
  cursor: default;
  color: var(--c1);
  background: var(--dither), var(--c3);
  box-shadow: var(--edge);
}

.pbtn--danger.is-armed {
  background: var(--c0);
  color: var(--c3);
}

.pbtn--run.is-ready:not(:disabled) {
  animation: ready-pulse 1.1s steps(1) infinite;
}

.iconbtn {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 40px;
  height: 40px;
  margin: 3px;
  border: 0;
  background: var(--c3);
  cursor: pointer;
  box-shadow: var(--edge), inset -3px -3px 0 var(--c2);
}

.iconbtn .ico {
  width: 20px;
  height: 20px;
}

.iconbtn:active {
  translate: 0 2px;
}

.iconbtn.is-pulsing {
  animation: icon-pulse 0.9s steps(1) infinite;
}

/* ───────────── Panels ───────────── */
.panel {
  background: var(--c3);
  box-shadow: var(--edge);
}

.fase__number {
  font-size: 0.72em;
  color: var(--c1);
}

/* ───────────── HUD bits ───────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 46px;
}

.topbar__title {
  flex: 1;
  min-width: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  font-size: 1.15em;
  line-height: 1.1;
}

.topbar__title h1 {
  margin: 0;
  font-size: 1em;
  line-height: 1.05;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.topbar__stats {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.topbar__timer {
  font-size: 0.72em;
  color: var(--c1);
}

.stat {
  display: inline-flex;
  align-items: center;
  gap: 0.25em;
  font-weight: 600;
}

.stat small {
  font-size: 0.72em;
  font-weight: 400;
}

.energy {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

.energy__icon {
  margin-right: 2px;
}

.energy__cell {
  width: 6px;
  height: 13px;
  background: var(--c2);
}

.energy__cell.is-full {
  background: var(--c0);
}

.stars {
  display: inline-flex;
  gap: 4px;
}

.star {
  color: var(--c2);
}

.star.is-on {
  color: var(--c0);
}

.stars--small .ico {
  width: 12px;
  height: 12px;
}

.stars--big {
  gap: 10px;
}

.stars--big .ico {
  width: 46px;
  height: 46px;
}

.star.is-pop {
  animation: pop 0.35s steps(4);
}

.xpbar {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8em;
  font-weight: 600;
}

.xpbar__track {
  flex: 1;
  height: 10px;
  margin: 0 2px;
  background: var(--c2);
  box-shadow: 0 -2px 0 var(--c0), 0 2px 0 var(--c0), -2px 0 0 var(--c0), 2px 0 0 var(--c0);
}

.xpbar__fill {
  display: block;
  width: var(--fill);
  height: 100%;
  background: repeating-linear-gradient(90deg, var(--c0) 0 6px, var(--c1) 6px 8px);
}

/* ───────────── Code chips (blocks) ───────────── */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 0.35em;
  min-height: 40px;
  margin: 3px;
  padding: 0.25em 0.55em;
  border: 0;
  background: var(--c3);
  color: var(--c0);
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--edge), inset 0 -3px 0 var(--c2);
}

.chip__icon {
  width: 1.3em;
  height: 1.3em;
}

.chip__label {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  line-height: 1;
}

.chip__label small {
  font-size: 0.68em;

    this.migrate = migrate;

  load() {

  }

    this.listeners.add(listener);
    return () => this.listeners.delete(listener);
  }
}

/** Draws a sprite (rows of palette indices) onto a 2D context at art-pixel scale 1. */
function drawSprite(ctx, rows, ox, oy, colors, { flip = false, tone = null } = {}) {
  const width = rows[0].length;
  rows.forEach((row, y) => {
    for (let x = 0; x < width; x += 1) {
      const ch = row[x];
      if (ch === '.') continue;
      ctx.fillStyle = tone ?? colors[Number(ch)];
      ctx.fillRect(ox + (flip ? width - 1 - x : x), oy + y, 1, 1);
    }
  });
}

/** Opaque pixels as [x, y, colorIndex] — used by the mentor reveal animation. */
function spritePixels(rows) {
  const pixels = [];
  rows.forEach((row, y) => [...row].forEach((ch, x) => ch !== '.' && pixels.push([x, y, Number(ch)])));
  return pixels;
}

function spriteCanvas(rows, colors, scale = 4, options = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = rows[0].length * scale;
  canvas.height = rows.length * scale;
  canvas.className = 'sprite';
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  drawSprite(ctx, rows, 0, 0, colors, options);
  return canvas;
}
